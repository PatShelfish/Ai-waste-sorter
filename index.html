<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AI Waste Sorter</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f7f3;
            text-align: center;
        }

        .header {
            background: #166534;
            color: white;
            padding: 20px;
        }

        .header h1 {
            margin: 0;
            font-size: 28px;
        }

        .header p {
            margin: 8px 0 0;
        }

        .container {
            max-width: 500px;
            margin: auto;
            padding: 20px;
        }

        .camera-box {
            background: white;
            border-radius: 20px;
            padding: 25px;
            margin-top: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .camera-icon {
            font-size: 70px;
            margin: 20px;
        }

        button {
            width: 100%;
            padding: 18px;
            border: none;
            border-radius: 12px;
            background: #166534;
            color: white;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #14532d;
        }

        button:disabled {
            background: #999;
            cursor: not-allowed;
        }

        .status {
            margin-top: 15px;
            font-size: 15px;
            color: #555;
        }

        .photo-preview {
            display: none;
            margin-top: 20px;
            padding: 20px;
            background: white;
            border-radius: 20px;
        }

        .photo-preview img {
            width: 100%;
            max-width: 400px;
            border-radius: 15px;
            margin-top: 10px;
        }

        .result {
            display: none;
            margin-top: 20px;
            padding: 25px;
            border-radius: 20px;
            background: white;
        }

        .result h2 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .item-name {
            font-size: 22px;
            font-weight: bold;
        }

        .bin-message {
            font-size: 22px;
            font-weight: bold;
        }

        .reset {
            margin-top: 15px;
            background: #555;
        }

        footer {
            margin-top: 30px;
            padding: 20px;
            color: #555;
            font-size: 14px;
        }

    </style>
</head>


<body>

    <!-- HEADER -->

    <div class="header">

        <h1>♻️ AI Waste Sorter</h1>

        <p>Artificial Intelligence for Better Life</p>

    </div>


    <div class="container">


        <!-- CAMERA SECTION -->

        <div class="camera-box">

            <div class="camera-icon">
                📷
            </div>

            <h2>Identify Your Waste</h2>

            <p>
                Take a photograph of a waste item
                and let AI identify its category.
            </p>

            <button
                id="scanButton"
                onclick="startCamera()">

                📷 SCAN WASTE

            </button>


            <!-- Camera input -->

            <input
                type="file"
                id="cameraInput"
                accept="image/*"
                capture="environment"
                style="display:none;"
            >


            <div id="status" class="status">

                Ready to scan.

            </div>

        </div>


        <!-- PHOTO PREVIEW -->

        <div
            id="photoPreview"
            class="photo-preview">

            <h3>📷 Captured Waste</h3>

            <img
                id="capturedImage"
                src=""
                alt="Captured waste"
            >

        </div>


        <!-- AI RESULT -->

        <div
            id="result"
            class="result">

            <h2 id="binTitle">
                🟢 GREEN BIN
            </h2>

            <p
                id="itemName"
                class="item-name">
            </p>

            <p
                id="message"
                class="bin-message">
            </p>

            <button
                class="reset"
                onclick="resetApp()">

                📷 SCAN ANOTHER ITEM

            </button>

        </div>

    </div>


    <!-- FOOTER -->

    <footer>

        AI-assisted waste classification project
        <br>
        Shreyasi School Project

    </footer>


    <script>


        /*
         * YOUR GEMINI BACKEND
         */

        const BACKEND_URL =
            "https://script.google.com/macros/s/AKfycbwor3lrZ5iE7Ob78pGXIM-CxgdPyJIPE_KJBj1ZUfXfTdWcnzHoWexjTxLhdCFszbZyGg/exec";


        /*
         * OPEN PHONE CAMERA
         */

        function startCamera() {

            const cameraInput =
                document.getElementById("cameraInput");

            const status =
                document.getElementById("status");

            cameraInput.value = "";

            status.innerText =
                "📷 Opening camera...";

            cameraInput.click();
        }


        /*
         * CAMERA PHOTO RECEIVED
         */

        document
            .getElementById("cameraInput")
            .addEventListener(
                "change",
                function(event) {

                    const file =
                        event.target.files[0];

                    if (!file) {

                        document.getElementById("status")
                            .innerText =
                            "No photo received.";

                        return;
                    }


                    /*
                     * Show original photo
                     */

                    const imageURL =
                        URL.createObjectURL(file);

                    document
                        .getElementById("capturedImage")
                        .src = imageURL;

                    document
                        .getElementById("photoPreview")
                        .style.display = "block";


                    /*
                     * Start AI analysis
                     */

                    analyzeImage(file);

                }
            );


        /*
         * RESIZE IMAGE
         *
         * This makes the photo smaller
         * before sending it to Gemini.
         */

        function resizeImage(file) {

            return new Promise(
                function(resolve, reject) {

                    const image =
                        new Image();

                    const reader =
                        new FileReader();


                    reader.onload =
                        function(e) {

                            image.src =
                                e.target.result;

                        };


                    image.onload =
                        function() {

                            const MAX_SIZE = 1280;

                            let width =
                                image.width;

                            let height =
                                image.height;


                            if (width > height) {

                                if (width > MAX_SIZE) {

                                    height =
                                        height *
                                        MAX_SIZE /
                                        width;

                                    width =
                                        MAX_SIZE;

                                }

                            } else {

                                if (height > MAX_SIZE) {

                                    width =
                                        width *
                                        MAX_SIZE /
                                        height;

                                    height =
                                        MAX_SIZE;

                                }

                            }


                            const canvas =
                                document.createElement(
                                    "canvas"
                                );


                            canvas.width =
                                width;

                            canvas.height =
                                height;


                            const ctx =
                                canvas.getContext(
                                    "2d"
                                );


                            ctx.drawImage(
                                image,
                                0,
                                0,
                                width,
                                height
                            );


                            /*
                             * Convert to JPEG
                             */

                            const dataURL =
                                canvas.toDataURL(
                                    "image/jpeg",
                                    0.75
                                );


                            resolve(dataURL);

                        };


                    image.onerror =
                        reject;


                    reader.onerror =
                        reject;


                    reader.readAsDataURL(file);

                }
            );
        }


        /*
         * SEND PHOTO TO GEMINI
         */

        async function analyzeImage(file) {

            const status =
                document.getElementById("status");

            const scanButton =
                document.getElementById(
                    "scanButton"
                );


            try {

                scanButton.disabled = true;

                status.innerText =
                    "🤖 AI is analyzing the waste...";


                /*
                 * Resize photograph
                 */

                const dataURL =
                    await resizeImage(file);


                /*
                 * Remove:
                 *
                 * data:image/jpeg;base64,
                 *
                 * leaving only Base64 data
                 */

                const base64Image =
                    dataURL.split(",")[1];


                /*
                 * Send to Apps Script
                 *
                 * text/plain avoids an unnecessary
                 * browser preflight request.
                 */

                const response =
                    await fetch(
                        BACKEND_URL,
                        {

                            method: "POST",

                            headers: {

                                "Content-Type":
                                    "text/plain;charset=utf-8"

                            },

                            body:
                                JSON.stringify({

                                    image:
                                        base64Image,

                                    mimeType:
                                        "image/jpeg"

                                })

                        }
                    );


                /*
                 * Read AI response
                 */

                const result =
                    await response.json();


                console.log(
                    "AI response:",
                    result
                );


                if (!result.success) {

                    throw new Error(
                        result.error ||
                        "AI analysis failed."
                    );

                }


                /*
                 * Show AI result
                 */

                showResult(
                    result.category,
                    result.item
                );


                status.innerText =
                    "✅ AI analysis complete!";


            } catch (error) {

                console.error(error);


                status.innerText =
                    "❌ AI analysis failed.";


                alert(
                    "AI analysis failed.\n\n" +
                    error.message
                );


            } finally {

                scanButton.disabled = false;

            }

        }


        /*
         * CONVERT AI CATEGORY
         * INTO BIN RECOMMENDATION
         */

        function showResult(
            category,
            item
        ) {

            const binTitle =
                document.getElementById(
                    "binTitle"
                );

            const itemName =
                document.getElementById(
                    "itemName"
                );

            const message =
                document.getElementById(
                    "message"
                );


            itemName.innerText =
                "AI identified: " + item;


            const cleanCategory =
                category
                    .toUpperCase()
                    .trim();


            /*
             * WET / ORGANIC
             */

            if (
                cleanCategory.includes(
                    "WET"
                ) ||
                cleanCategory.includes(
                    "ORGANIC"
                )
            ) {

                binTitle.innerText =
                    "🟢 GREEN BIN";

                message.innerText =
                    "Please throw it in the GREEN bin.";

            }


            /*
             * DRY / RECYCLABLE
             */

            else if (
                cleanCategory.includes(
                    "DRY"
                ) ||
                cleanCategory.includes(
                    "RECYCLABLE"
                )
            ) {

                binTitle.innerText =
                    "🔵 BLUE BIN";

                message.innerText =
                    "Please throw it in the BLUE bin.";

            }


            /*
             * HAZARDOUS
             */

            else if (
                cleanCategory.includes(
                    "HAZARDOUS"
                )
            ) {

                binTitle.innerText =
                    "🔴 HAZARDOUS WASTE";

                message.innerText =
                    "Please use the appropriate hazardous/e-waste collection system.";

            }


            /*
             * OTHER
             */

            else {

                binTitle.innerText =
                    "⚫ OTHER / REJECT";

                message.innerText =
                    "Please follow your local waste-disposal instructions.";

            }


            /*
             * Show result box
             */

            document
                .getElementById("result")
                .style.display = "block";

        }


        /*
         * RESET
         */

        function resetApp() {

            document
                .getElementById("photoPreview")
                .style.display = "none";


            document
                .getElementById("result")
                .style.display = "none";


            document
                .getElementById("capturedImage")
                .src = "";


            document
                .getElementById("status")
                .innerText =
                "Ready to scan.";

        }

    </script>

</body>

</html>
